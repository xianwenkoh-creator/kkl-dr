<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<title>KKL Site Safety CMS</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --field:#fafbfc;
    --ink:#1d2226; --sub:#6a7278; --line:#e3e6e9; --line2:#c9cfd4;
    --acc:#0e8ba0; --acc-soft:#e0f2f5; --badge:#e02d2d;
    --good-ink:#086e08; --good-bg:rgba(12,163,12,.13);
    --warn-ink:#8a5b00; --warn-bg:rgba(250,178,25,.18);
    --bad-ink:#b32222;  --bad-bg:rgba(208,59,59,.13);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --viz-grid:#e1e0d9; --viz-axis:#c3c2b7; --viz-muted:#898781;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111417; --card:#1b1f23; --field:#22262b;
      --ink:#e8eaec; --sub:#9aa3a9; --line:#2b3136; --line2:#3f474d;
      --acc:#4cc3d0; --acc-soft:#11333a; --badge:#e04b4b;
      --good-ink:#4fce6a; --good-bg:rgba(12,163,12,.22);
      --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.16);
      --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.18);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70;
      --viz-grid:#2c2c2a; --viz-axis:#383835; --viz-muted:#898781;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111417; --card:#1b1f23; --field:#22262b;
    --ink:#e8eaec; --sub:#9aa3a9; --line:#2b3136; --line2:#3f474d;
    --acc:#4cc3d0; --acc-soft:#11333a; --badge:#e04b4b;
    --good-ink:#4fce6a; --good-bg:rgba(12,163,12,.22);
    --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.16);
    --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.18);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --viz-grid:#2c2c2a; --viz-axis:#383835; --viz-muted:#898781;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.45; color:var(--ink); background:var(--bg);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:720px; margin:0 auto; padding:10px 14px 60px;}

  header.top{display:flex; align-items:center; gap:8px; padding:10px 0 14px; position:sticky; top:0; background:var(--bg); z-index:5;}
  header.top h1{font-size:19px; font-weight:700; margin:0; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .spacer{flex:1;}
  .iconbtn{background:none; border:none; color:var(--ink); width:40px; height:40px; padding:7px; cursor:pointer; border-radius:10px; flex:0 0 auto;}
  .iconbtn:active{background:var(--acc-soft);}
  .iconbtn svg{width:100%; height:100%;}

  h2.sect{font-size:20px; font-weight:700; margin:22px 0 14px;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px 8px;}
  .tile{text-align:center; text-decoration:none; color:var(--ink); -webkit-tap-highlight-color:transparent;}
  .tile .ic{position:relative; width:66px; height:66px; margin:0 auto 8px; border-radius:50%;
            background:var(--card); border:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.05);
            display:flex; align-items:center; justify-content:center;}
  .tile .ic svg{width:32px; height:32px; color:var(--acc);}
  .tile:active .ic{background:var(--acc-soft);}
  .tile .tl{display:block; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink);}
  .tile .bdg{position:absolute; top:-5px; right:-8px; min-width:22px; padding:1px 6px; border-radius:11px;
             background:var(--badge); color:#fff; font-size:12px; font-weight:700; line-height:1.5;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .foot{margin-top:26px; font-size:12px; color:var(--sub); text-align:center;}

  /* list */
  .searchwrap{margin-bottom:10px;}
  .searchwrap input{width:100%;}
  .lrow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:11px 13px; margin-bottom:8px; cursor:pointer;}
  .lrow:active{background:var(--acc-soft);}
  .lmain{flex:1; min-width:0;}
  .lt{font-size:15px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ls{font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .lmeta{flex:0 0 auto; text-align:right; max-width:40%;}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:34px 16px; line-height:1.6;}
  .empty .btn{margin-top:12px;}

  .chip{display:inline-block; font-size:11px; font-weight:700; padding:2.5px 9px; border-radius:11px;
        background:var(--acc-soft); color:var(--acc); white-space:nowrap; margin-left:3px;}
  .chip.g{background:var(--good-bg); color:var(--good-ink);}
  .chip.w{background:var(--warn-bg); color:var(--warn-ink);}
  .chip.b{background:var(--bad-bg); color:var(--bad-ink);}
  .chip.n{background:var(--field); color:var(--sub); border:1px solid var(--line);}
  a.chip.lnk{text-decoration:none;}

  /* forms */
  label{display:block; font-size:12.5px; font-weight:650; color:var(--sub); margin:12px 0 4px;}
  input,select,textarea{width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--field);
        border:1px solid var(--line2); border-radius:8px; padding:9px 11px; min-height:44px;}
  textarea{min-height:0;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}
  input.err,select.err,textarea.err{border-color:var(--bad-ink); outline:2px solid var(--bad-ink);}
  .hint{font-size:12px; color:var(--sub); margin-top:4px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}
  .fgrid .fld{grid-column:1/-1; min-width:0;}
  .fgrid .fld.half{grid-column:auto;}

  .btn{display:inline-block; font:inherit; font-size:15px; font-weight:700; color:#fff; background:var(--acc);
       border:none; border-radius:9px; padding:12px 20px; cursor:pointer; min-height:46px;}
  .btn.ghost{background:none; color:var(--acc); border:1.5px solid var(--acc);}
  .btn.danger{background:none; color:var(--bad-ink); border:1.5px solid var(--bad-ink);}
  .btnrow{display:flex; gap:10px; margin-top:18px;}
  .btnrow .btn:first-child{flex:1;}
  .minor{background:none; border:1.5px dashed var(--line2); color:var(--acc); font-size:13.5px; font-weight:650;
         border-radius:8px; padding:9px 12px; cursor:pointer; width:100%; margin-top:8px;}

  /* repeating sub-rows */
  .rowswrap{display:flex; flex-direction:column; gap:8px;}
  .subrow{position:relative; border:1px solid var(--line); border-radius:10px; background:var(--field); padding:10px 34px 10px 10px;}
  .subrow .rm{position:absolute; top:6px; right:6px; width:26px; height:26px; border:none; background:none;
              color:var(--bad-ink); font-size:17px; line-height:1; cursor:pointer; border-radius:6px; padding:0;}
  .sub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:7px;}
  .cell{min-width:0;}
  .cell.full{grid-column:1/-1;}
  .cell .cl{display:block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); margin-bottom:2px;}
  .cell input,.cell select{min-height:38px; padding:6px 8px; font-size:14px; background:var(--card);}
  .cell textarea{padding:6px 8px; font-size:14px; background:var(--card);}

  /* member picker */
  .pickgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  @media(min-width:520px){.pickgrid{grid-template-columns:repeat(3,1fr);}}
  .pick{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:8px; background:var(--field);
        padding:7px 9px; font-size:13.5px; font-weight:600; color:var(--sub); cursor:pointer; margin:0; user-select:none;}
  .pick input{width:17px; height:17px; min-height:0; padding:0; margin:0; flex:0 0 auto; accent-color:var(--acc);}
  .pick:has(input:checked){border-color:var(--acc); background:var(--acc-soft); color:var(--ink);}
  .pick span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* cert expiry */
  .exphead{font-size:13px; font-weight:750; letter-spacing:.05em; text-transform:uppercase; margin:20px 0 8px;}
  .exphead.b{color:var(--bad-ink);} .exphead.w{color:var(--warn-ink);} .exphead.g{color:var(--good-ink);} .exphead.n{color:var(--sub);}

  /* statistics */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .stile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px;}
  .stile .v{font-size:22px; font-weight:750; line-height:1.2;}
  .stile .l{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--sub); margin-top:2px;}
  .charthead{font-size:14px; font-weight:700; margin:2px 0 4px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub); font-weight:600; margin:2px 0 6px;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .chartwrap{overflow-x:auto;}
  .chartwrap svg{display:block; width:100%; height:auto; min-width:480px;}
  .bar{cursor:pointer;}
  .bar:hover{opacity:.82;}
  .tip{position:fixed; display:none; z-index:50; background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600;
       padding:5px 9px; border-radius:7px; pointer-events:none; max-width:240px;}
  .dtable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  .dtable th,.dtable td{border-bottom:1px solid var(--line); padding:4px 6px; text-align:right; font-variant-numeric:tabular-nums;}
  .dtable th:first-child,.dtable td:first-child{text-align:left;}
  .dtable th{color:var(--sub); font-weight:700;}
  details summary{cursor:pointer; font-size:13.5px; font-weight:650; color:var(--acc);}
  .mhgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px;}
  .mh span{display:block; font-size:11px; font-weight:700; color:var(--sub); margin-bottom:2px;}
  .mh input{min-height:38px; padding:6px 8px; font-size:14px;}

  /* photos */
  .thumbs{display:flex; gap:8px; flex-wrap:wrap;}
  .thumb{position:relative; width:86px; height:86px; border:1px solid var(--line2); border-radius:8px; overflow:hidden; flex:0 0 auto;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rmp{position:absolute; top:3px; right:3px; width:22px; height:22px; border:none; border-radius:50%;
              background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:1; cursor:pointer; padding:0;}

  /* ranked horizontal bars */
  .hbar{margin:8px 0;}
  .hbar .hlab{font-size:12.5px; color:var(--sub); font-weight:600; display:flex; justify-content:space-between; gap:10px;}
  .hbar .hlab b{color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hbar .htrack{background:var(--field); border:1px solid var(--line); border-radius:4px; height:14px; margin-top:3px; overflow:hidden;}
  .hbar .hfill{height:100%; background:var(--s1); border-radius:3px; min-width:2px;}

  /* monthly report */
  .repmeta{font-size:13px; color:var(--sub); line-height:1.7;}
  .repmeta b{color:var(--ink);}

  select{appearance:auto;}
  @media (max-width:390px){ .grid{gap:16px 4px;} .tile .ic{width:60px;height:60px;} .tiles{grid-template-columns:repeat(2,1fr);} }
  @media print{
    body{background:#fff;}
    .wrap{max-width:none; padding:0;}
    header.top{position:static;}
    .iconbtn,.searchwrap,.btn,.minor,.noprint{display:none !important;}
    .card,.stile{break-inside:avoid; border-color:#bbb;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
'use strict';
/* ============ helpers ============ */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00'); if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'2-digit'}); }
function daysTo(iso){ if(!iso) return null; const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(iso+'T00:00'); if(isNaN(d)) return null; return Math.round((d-t)/864e5); }
function expChip(iso, warn){ const d=daysTo(iso); if(d===null) return ''; warn=warn||30;
  if(d<0) return '<span class="chip b">expired '+fmtD(iso)+'</span>';
  if(d<=warn) return '<span class="chip w">'+d+'d left</span>';
  return '<span class="chip g">'+fmtD(iso)+'</span>'; }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function csvEsc(v){ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadText(name, text, mime){
  const blob=new Blob(['﻿'+text],{type:mime||'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function compressImage(file, cb){
  const img=new Image();
  img.onload=()=>{
    const max=900, sc=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL('image/jpeg',0.55));
  };
  img.onerror=()=>{ URL.revokeObjectURL(img.src); alert('Could not read that image.'); };
  img.src=URL.createObjectURL(file);
}

/* ============ storage ============ */
const KEY='kkl-cms-v1';
const BLANK={contacts:[],members:[],equipment:[],documents:[],tbm:[],inspections:[],observations:[],checklists:[],ra:[],training:[],meetings:[],incidents:[],manhours:{},mandays:{},settings:{project:'',company:'',hdbContract:'',siteRef:'',estate:'',neighbourhood:'',precinct:''}};
function load(){ try{ const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); const out=structuredClone(BLANK);
      for(const k in out){ if(d[k]!==undefined) out[k]=d[k]; } return out; }
  }catch(e){ console.warn('load failed',e); }
  return structuredClone(BLANK); }
let db=load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('Browser storage is full — the last change could NOT be saved. Remove some photos or old records, or export a backup and clear data.'); }
}

/* ============ icons ============ */
const ICONS={
  back:'<path d="M15 5l-7 7 7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/>',
  contact:'<circle cx="9.5" cy="8" r="3.4"/><path d="M4 20c.6-3.6 2.8-5.5 5.5-5.5S14.4 16.4 15 20"/><path d="M17 7h4M17 10.5h4M17 14h2.5"/>',
  members:'<circle cx="9" cy="9" r="3.2"/><path d="M3.5 20c.5-3.3 2.6-5 5.5-5s5 1.7 5.5 5"/><circle cx="16.8" cy="7.8" r="2.6"/><path d="M16.3 14.6c2.6.2 4 1.8 4.5 4.4"/>',
  equip:'<rect x="3.5" y="14.5" width="11.5" height="5" rx="2.5"/><path d="M6.5 14.5V10h5.5v4.5"/><path d="M12 10.5l4-4.5 4.5 2"/><path d="M20.5 8v4.5"/>',
  cert:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.8" r="2"/><path d="M5.5 16.2c.4-1.6 1.6-2.5 3-2.5s2.6.9 3 2.5M14.5 9.5H19M14.5 13H19"/>',
  doc:'<path d="M12 3.5l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16.5l8 4 8-4"/>',
  tbm:'<rect x="3.5" y="8" width="17" height="11.5" rx="2"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M3.5 12.5h17"/>',
  insp:'<rect x="6" y="10.5" width="12" height="9" rx="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M12 13.8v2.4"/>',
  check:'<path d="M12 3.5l7 2.5v5.5c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/>',
  ra:'<path d="M6.5 17v-4.3a5.5 5.5 0 0 1 11 0V17"/><path d="M4.5 19.5h15"/><path d="M12 4v2M5.6 6.6l1.4 1.4M18.4 6.6L17 8"/>',
  train:'<path d="M12 6.5c-1.8-1.5-4.2-2-7-2v13c2.8 0 5.2.5 7 2 1.8-1.5 4.2-2 7-2v-13c-2.8 0-5.2.5-7 2z"/><path d="M12 6.5v13"/>',
  meet:'<circle cx="8" cy="7.5" r="2.3"/><circle cx="16" cy="7.5" r="2.3"/><path d="M4 19.5v-.8c0-2.2 1.7-3.8 4-3.8s4 1.6 4 3.8v.8M12.3 15.6c.5-.4 1.6-.7 3.7-.7 2.3 0 4 1.6 4 3.8v.8"/>',
  incid:'<path d="M7.5 16.5h-1a3.5 3.5 0 0 1-.4-7A5 5 0 0 1 16 8.3a4 4 0 0 1 1.6 7.6"/><path d="M12.7 11l-2.2 3.7h3l-2.2 3.8"/>',
  stats:'<path d="M4.5 19.5h15"/><path d="M7 16.5V12M11 16.5v-7M15 16.5v-5M19 16.5V8"/><path d="M5.5 9L10 5l3.5 2.5L18 3.5"/><path d="M15.8 3.5H18V5.7"/>',
  obs:'<path d="M2.5 12s3.5-6.2 9.5-6.2S21.5 12 21.5 12s-3.5 6.2-9.5 6.2S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  dl:'<path d="M12 4v11M7.5 11l4.5 4.5L16.5 11"/><path d="M4.5 19.5h15"/>'
};
const ic = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';

/* ============ generic form engine ============ */
const app=document.getElementById('app');
let curEdit=null;

function fieldHtml(f, v){
  let val = (v===undefined||v===null) ? '' : v;
  if(val==='' && v===undefined && f.def!==undefined) val = (f.def==='today') ? today() : f.def;
  let inner='';
  const t=f.type||'text';
  if(t==='textarea'){
    inner='<textarea data-f="'+f.k+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  }else if(t==='select'){
    inner='<select data-f="'+f.k+'"><option value=""></option>'+
      f.opts.map(o=>'<option'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }else{
    const listArr = f.list ? (typeof f.list==='function'?f.list():f.list) : null;
    inner='<input data-f="'+f.k+'" type="'+t+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'"'+
      (listArr?' list="dl-'+f.k+'"':'')+'>'+
      (listArr?'<datalist id="dl-'+f.k+'">'+listArr.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>':'');
  }
  return '<div class="fld'+(f.half?' half':'')+'"><label>'+esc(f.label)+(f.req?' *':'')+'</label>'+inner+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}

function subRow(f, r){
  r=r||{};
  const cell=c=>{
    const v=r[c.k]===undefined?'':r[c.k];
    let inp;
    if(c.type==='select'){
      inp='<select data-c="'+c.k+'"><option value=""></option>'+
        (c.opts||[]).map(o=>'<option'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    }else if(c.type==='textarea'){
      inp='<textarea data-c="'+c.k+'" rows="2">'+esc(v)+'</textarea>';
    }else{
      inp='<input data-c="'+c.k+'" type="'+(c.type||'text')+'" value="'+esc(v)+'">';
    }
    return '<div class="cell'+(c.w==='full'?' full':'')+'"><span class="cl">'+esc(c.label)+'</span>'+inp+'</div>';
  };
  return '<div class="subrow"><button type="button" class="rm" title="Remove row" aria-label="Remove row">&times;</button><div class="sub-grid">'+f.cols.map(cell).join('')+'</div></div>';
}

function rowsHtml(f, arr){
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+
    '<div class="rowswrap" data-rows="'+f.k+'">'+(arr||[]).map(r=>subRow(f,r)).join('')+'</div>'+
    '<button type="button" class="minor" data-addrow="'+f.k+'">+ '+esc(f.add||'Add row')+'</button>'+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}

function thumbHtml(dataUrl){
  return '<div class="thumb"><img src="'+dataUrl+'" alt="photo"><button type="button" class="rmp" title="Remove photo" aria-label="Remove photo">&times;</button></div>';
}
function photosHtml(f, arr){
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+
    '<div class="thumbs" data-photos="'+f.k+'">'+(arr||[]).map(thumbHtml).join('')+'</div>'+
    '<button type="button" class="minor" data-addphoto="'+f.k+'">+ Add photo</button>'+

function membersHtml(f, ids){
  ids=ids||[];
  const ms=[...db.members].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const grid = ms.length
    ? '<div class="pickgrid" data-f="'+f.k+'" data-type="members">'+
        ms.map(m=>'<label class="pick"><input type="checkbox" data-mid="'+m.id+'"'+(ids.includes(m.id)?' checked':'')+'><span>'+esc(m.name)+'</span></label>').join('')+'</div>'
    : '<div class="hint">No members registered yet — add workers under Member(s) to tick attendance here.</div>';
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+grid+'</div>';
}

function collectRows(wrap){
  if(!wrap) return [];
  return [...wrap.querySelectorAll(':scope > .subrow')].map(sr=>{
    const o={};
    sr.querySelectorAll('[data-c]').forEach(el=>o[el.dataset.c]=el.value.trim());
    return o;
  }).filter(o=>Object.values(o).some(v=>v!==''));
}

function collectForm(mod){
  const obj={}; let ok=true, first=null;
  for(const f of mod.fields){
    if(f.type==='rows'){ obj[f.k]=collectRows(app.querySelector('[data-rows="'+f.k+'"]')); continue; }
    if(f.type==='photos'){
      const pw=app.querySelector('[data-photos="'+f.k+'"]');
      obj[f.k]=pw?[...pw.querySelectorAll('img')].map(im=>im.src):[];
      continue;
    }
    if(f.type==='members'){
      const pg=app.querySelector('.pickgrid[data-f="'+f.k+'"]');
      obj[f.k]=pg?[...pg.querySelectorAll('[data-mid]')].filter(c=>c.checked).map(c=>c.dataset.mid):[];
      continue;
    }
    const el=app.querySelector('[data-f="'+f.k+'"]');
    const v=el?el.value.trim():'';
    obj[f.k]=v;
    if(el) el.classList.remove('err');
    if(f.req && !v){ ok=false; if(el){el.classList.add('err'); first=first||el;} }
  }
  if(!ok){ if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return null; }
  return obj;
}

/* delegated handlers for repeating rows */
app.addEventListener('click', e=>{
  const add=e.target.closest('[data-addrow]');
  if(add && curEdit){
    const f=MODULES[curEdit.key].fields.find(x=>x.k===add.dataset.addrow);
    const wrap=app.querySelector('[data-rows="'+f.k+'"]');
    if(f && wrap){ wrap.insertAdjacentHTML('beforeend', subRow(f)); }
    return;
  }
  const rm=e.target.closest('.subrow .rm');
  if(rm){ rm.closest('.subrow').remove(); return; }
  const ap=e.target.closest('[data-addphoto]');
  if(ap){
    const wrap=app.querySelector('[data-photos="'+ap.dataset.addphoto+'"]');
    if(wrap && wrap.children.length>=3){ alert('Maximum 3 photos per field — remove one first.'); return; }
    const inp=app.querySelector('[data-photofile="'+ap.dataset.addphoto+'"]');
    if(inp) inp.click();
    return;
  }
  const rp=e.target.closest('.thumb .rmp');
  if(rp){ rp.closest('.thumb').remove(); }
});
app.addEventListener('change', e=>{
  const inp=e.target.closest('[data-photofile]');
  if(!inp || !inp.files || !inp.files[0]) return;
  const file=inp.files[0]; inp.value='';
  const wrap=app.querySelector('[data-photos="'+inp.dataset.photofile+'"]');
  if(!wrap) return;
  compressImage(file, dataUrl=>wrap.insertAdjacentHTML('beforeend', thumbHtml(dataUrl)));
});

function renderList(key){
  const mod=MODULES[key];
  let items=[...db[mod.store]];
  items.sort(mod.sort || ((a,b)=>(b.date||'').localeCompare(a.date||'')));
  app.innerHTML = header(mod.title, true,
      (items.length?'<button class="iconbtn" aria-label="Export CSV" title="Export CSV (Excel)" onclick="exportModuleCsv(\''+key+'\')">'+ic('dl')+'</button>':'')+
      '<button class="iconbtn" aria-label="Add" onclick="location.hash=\'#/'+key+'/new\'">'+ic('plus')+'</button>')+
    '<div class="searchwrap"><input id="q" type="search" placeholder="Search '+mod.title.toLowerCase()+'&hellip;" autocomplete="off"></div>'+
    '<div id="rows"></div>';
  const rowsEl=document.getElementById('rows');
  const draw=q=>{
    q=(q||'').toLowerCase();
    const f=q?items.filter(i=>JSON.stringify(i).toLowerCase().includes(q)):items;
    rowsEl.innerHTML = f.length ? f.map(i=>
      '<div class="lrow" onclick="location.hash=\'#/'+key+'/'+i.id+'\'">'+
        '<div class="lmain"><div class="lt">'+(mod.line1(i)||'<span style="color:var(--sub)">(untitled)</span>')+'</div>'+
        '<div class="ls">'+(mod.line2?mod.line2(i):'')+'</div></div>'+
        '<div class="lmeta">'+(mod.meta?mod.meta(i):'')+'</div></div>').join('')
     : '<div class="empty">'+(q?'No matches.':(mod.empty||'No records yet.'))+
       (q?'':'<br><button class="btn" style="margin-top:12px" onclick="location.hash=\'#/'+key+'/new\'">+ Add first record</button>')+'</div>';
  };
  draw('');
  document.getElementById('q').oninput=e=>draw(e.target.value);
}

function renderEdit(key, id){
  const mod=MODULES[key];
  const item=id?db[mod.store].find(x=>x.id===id):null;
  if(id && !item){ location.hash='#/'+key; return; }
  curEdit={key,id};
  app.innerHTML = header((item?'Edit — ':'New — ')+mod.title, true)+
    '<div class="card"><div class="fgrid">'+
    mod.fields.map(f=>{
      const v=item?item[f.k]:undefined;
      if(f.type==='rows') return rowsHtml(f, v);
      if(f.type==='members') return membersHtml(f, v);
      if(f.type==='photos') return photosHtml(f, v);
      return fieldHtml(f, v);
    }).join('')+
    '</div><div class="btnrow"><button class="btn" id="saveBtn">Save</button>'+
    (item?'<button class="btn danger" id="delBtn">Delete</button>':'')+'</div></div>';
  document.getElementById('saveBtn').onclick=()=>{
    const obj=collectForm(mod); if(!obj) return;
    if(item){ Object.assign(item,obj); }
    else{ obj.id=uid(); db[mod.store].push(obj); }
    if(mod.beforeSave) mod.beforeSave(item||obj);
    save(); location.hash='#/'+key;
  };
  const del=document.getElementById('delBtn');
  if(del) del.onclick=()=>{
    if(confirm('Delete this record? This cannot be undone.')){
      db[mod.store]=db[mod.store].filter(x=>x.id!==id); save(); location.hash='#/'+key;
    }
  };
  if(mod.afterRender) mod.afterRender(item);
}

/* ============ router ============ */
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  curEdit=null;
  if(!p.length) return renderHome();
  const key=p[0], sub=p[1];
  if(key==='certexp')  return renderCertExp();
  if(key==='stats')    return renderStats();
  if(key==='report')   return renderReport();
  if(key==='settings') return renderSettings();
  if(MODULES[key]){
    if(!sub) return renderList(key);
    if(sub==='new') return renderEdit(key,null);
    return renderEdit(key,sub);
  }
  renderHome();
}
window.addEventListener('hashchange', route);

/* ============ cert expiry dashboard ============ */
function certRows(){
  const out=[];
  const push=(cat,owner,name,expiry,link,warn)=>{ const d=daysTo(expiry);
    if(d!==null) out.push({cat,owner,name,expiry,days:d,link,warn:warn||30}); };
  db.members.forEach(m=>{
    if(m.wpExpiry) push('Work pass', m.name, 'Work pass', m.wpExpiry, '#/members/'+m.id);
    (m.certs||[]).forEach(c=>push('Member cert', m.name, c.name||'Cert', c.expiry, '#/members/'+m.id));
  });
  db.equipment.forEach(e=>{
    const label=[e.type,e.regNo].filter(Boolean).join(' ');
    (e.certs||[]).forEach(c=>push('Equipment', label, c.name||'LM/LG cert', c.expiry, '#/equipment/'+e.id));
    if(e.hdbML) push('Equipment', label, 'HDB Material List', e.hdbML, '#/equipment/'+e.id);
    if(e.aeDue) push('Equipment', label, 'AE inspection & test', e.aeDue, '#/equipment/'+e.id);
    if(e.serviceDue) push('Equipment', label, 'Crane servicing', e.serviceDue, '#/equipment/'+e.id, 14);
  });
  db.training.forEach(t=>push('Training', t.name, t.course, t.expiry, '#/training/'+t.id));
  db.documents.forEach(d=>push('Document', d.title, 'Validity', d.expiry, '#/documents/'+d.id));
  return out.sort((a,b)=>a.days-b.days);
}
function certBadgeCount(){ return certRows().filter(r=>r.days<=r.warn).length; }

function renderCertExp(){
  const rows=certRows();
  const groups=[
   {t:'Expired', c:'b', f:r=>r.days<0},
   {t:'Due within 30 days', c:'w', f:r=>r.days>=0&&r.days<=30},
   {t:'Due within 90 days', c:'n', f:r=>r.days>30&&r.days<=90},
   {t:'Valid (beyond 90 days)', c:'g', f:r=>r.days>90}];
  const row=r=>'<div class="lrow" onclick="location.hash=\''+r.link+'\'">'+
    '<div class="lmain"><div class="lt">'+esc(r.owner)+'</div>'+
    '<div class="ls">'+esc(r.cat)+' · '+esc(r.name)+'</div></div>'+
    '<div class="lmeta">'+expChip(r.expiry, r.warn)+'</div></div>';
  app.innerHTML = header('Cert Expiry', true)+
    (rows.length
      ? groups.map(g=>{ const gr=rows.filter(g.f); if(!gr.length) return '';
          return '<div class="exphead '+g.c+'">'+g.t+' ('+gr.length+')</div>'+gr.map(row).join(''); }).join('')
      : '<div class="empty">Nothing to track yet.<br>Expiry dates you enter on Members, Equipment, Training and Documents all roll up here automatically.</div>');
}

/* ============ CSV export ============ */
function exportModuleCsv(key){
  const mod=MODULES[key];
  const items=[...db[mod.store]].sort(mod.sort || ((a,b)=>(b.date||'').localeCompare(a.date||'')));
  const heads=['ID'], getters=[i=>i.id];
  mod.fields.forEach(f=>{
    if(f.type==='photos'){ heads.push(f.label+' (count)'); getters.push(i=>(i[f.k]||[]).length); return; }
    if(f.type==='rows'){ heads.push(f.label);
      getters.push(i=>(i[f.k]||[]).map(r=>f.cols.map(c=>r[c.k]).filter(Boolean).join(' / ')).join(' | ')); return; }
    if(f.type==='members'){ heads.push(f.label);
      getters.push(i=>(i[f.k]||[]).map(id=>{const m=db.members.find(x=>x.id===id); return m?m.name:'';}).filter(Boolean).join('; ')); return; }
    heads.push(f.label); getters.push(i=>i[f.k]??'');
  });
  const lines=[heads.map(csvEsc).join(',')]
    .concat(items.map(i=>getters.map(g=>csvEsc(g(i))).join(',')));
  downloadText(mod.store+'-'+today()+'.csv', lines.join('\r\n'));
}

let statsYear=new Date().getFullYear();
const ACC_TYPES=['First Aid Case','Medical Treatment / MC','Lost Time Injury','Fatality'];

function inYear(r,yr){ return r.date && +r.date.slice(0,4)===yr; }
function byMonth(arr,yr){ const m=Array(12).fill(0);
  arr.forEach(r=>{ if(inYear(r,yr)){ const i=+r.date.slice(5,7)-1; if(i>=0&&i<12) m[i]++; } }); return m; }
function niceStep(max){ const raw=max/4||1; const p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]){ if(raw<=m*p) return m*p; } return 10*p; }

function barChartSVG(labels, series){
  const W=720,H=230,padL=36,padR=8,padT=10,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=Math.max(1,niceStep(max)), top=Math.ceil(max/step)*step;
  let grid='';
  for(let v=0; v<=top; v+=step){
    const y=padT+plotH-(v/top)*plotH;
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+(v===0?'var(--viz-axis)':'var(--viz-grid)')+'" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--viz-muted)">'+v+'</text>';
  }
  const n=labels.length, gw=plotW/n, ns=series.length;
  const bw=Math.min(20,(gw-8)/ns);
  let bars='', xlab='';
  labels.forEach((lb,i)=>{
    xlab+='<text x="'+(padL+i*gw+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--viz-muted)">'+lb+'</text>';
    series.forEach((s,si)=>{
      const v=s.values[i]; if(!v) return;
      const h=(v/top)*plotH;
      const x=padL+i*gw+(gw-ns*bw-(ns-1)*2)/2+si*(bw+2);
      const y=padT+plotH-h;
      bars+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
        '" rx="2" fill="'+s.color+'" data-tip="'+esc(lb+' — '+s.name+': '+v)+'"/>';
    });
  });
  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" font-family="system-ui,sans-serif">'+grid+bars+xlab+'</svg></div>';
}

function bindTips(){
  const tip=document.getElementById('tip');
  const move=e=>{ const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
    tip.style.left=Math.max(4,Math.min(x+12,innerWidth-tip.offsetWidth-8))+'px';
    tip.style.top=Math.max(4,y-34)+'px'; };
  app.querySelectorAll('.bar').forEach(b=>{
    const show=e=>{ tip.textContent=b.dataset.tip; tip.style.display='block'; move(e); };
    b.addEventListener('mouseenter',show);
    b.addEventListener('mousemove',move);
    b.addEventListener('mouseleave',()=>tip.style.display='none');
    b.addEventListener('click',e=>{ show(e); setTimeout(()=>tip.style.display='none',1800); });
  });
}

    '</table></details>';
}

function renderStats(){
  const yr=statsYear;
  const years=new Set([new Date().getFullYear()]);
  [].concat(db.incidents,db.tbm,db.inspections,db.checklists,db.meetings).forEach(r=>{ if(r.date&&/^\d{4}/.test(r.date)) years.add(+r.date.slice(0,4)); });
  Object.keys(db.manhours).forEach(k=>{ if(/^\d{4}/.test(k)) years.add(+k.slice(0,4)); });
  const yrOpts=[...years].sort((a,b)=>b-a).map(y=>'<option'+(y===yr?' selected':'')+'>'+y+'</option>').join('');

  const mh=MONTHS.reduce((s,_,i)=>s+(+db.manhours[yr+'-'+String(i+1).padStart(2,'0')]||0),0);
  const inc=db.incidents.filter(r=>inYear(r,yr));
  const lti=inc.filter(r=>r.type==='Lost Time Injury'||r.type==='Fatality').length;
  const acc=inc.filter(r=>ACC_TYPES.includes(r.type)).length;
  const doN=inc.filter(r=>r.type==='Dangerous Occurrence').length;
  const daysLost=inc.reduce((s,r)=>s+(+r.daysLost||0),0);
  const ltifr=mh?(lti*1e6/mh):null;
  const afr=mh?(acc*1e6/mh):null;
  const openObs=db.observations.filter(o=>o.kind!==OBS_POS&&o.status!=='Closed').length;
  const openF=db.inspections.flatMap(i=>i.findings||[]).filter(f=>f.status!=='Closed'&&(f.desc||f.action)).length
             +db.incidents.flatMap(i=>i.actions||[]).filter(a=>a.status!=='Closed'&&(a.desc||a.by)).length
             +db.meetings.flatMap(m=>m.agenda||[]).filter(a=>a.status!=='Closed'&&(a.item||a.action)).length;
  const tbmN=db.tbm.filter(r=>inYear(r,yr)).length;

  const tile=(v,l)=>'<div class="stile"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';
  const actSeries=[
    {name:'TBM',        color:'var(--s1)', values:byMonth(db.tbm,yr)},
    {name:'Inspections',color:'var(--s2)', values:byMonth(db.inspections,yr)},
    {name:'Checklists', color:'var(--s3)', values:byMonth(db.checklists,yr)}];
  const incSeries=[{name:'Incidents',color:'var(--s1)',values:byMonth(db.incidents,yr)}];
  const typeCounts=INCTYPES.map(t=>[t,inc.filter(r=>r.type===t).length]).filter(x=>x[1]>0);

  const mhGrid=MONTHS.map((m,i)=>{ const k=yr+'-'+String(i+1).padStart(2,'0');
    const v=db.manhours[k]; return '<label class="mh"><span>'+m+'</span><input type="number" min="0" inputmode="numeric" data-mh="'+k+'" value="'+(v??'')+'"></label>'; }).join('');

  app.innerHTML = header('Statistics', true,
      '<select id="yrSel" style="width:auto;min-height:38px;padding:6px 8px">'+yrOpts+'</select>')+
    '<div class="tiles">'+
      tile(mh?mh.toLocaleString():'—','Man-hours '+yr)+
      tile(acc,'Accidents')+
      tile(afr===null?'—':afr.toFixed(2),'AFR / mil hrs')+
      tile(lti,'Lost-time inj.')+
      tile(ltifr===null?'—':ltifr.toFixed(2),'LTIFR / mil hrs')+
      tile(daysLost,'Man-days lost')+
      tile(doN,'Dangerous occ.')+
      tile(openF,'Open actions')+
      tile(openObs,'Open observations')+
    '</div>'+
    '<a class="btn ghost noprint" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="#/report">Monthly safety data report (HDB format) &rarr;</a>'+
    '<div class="card"><div class="charthead">Incidents by month — '+yr+'</div>'+
      barChartSVG(MONTHS,incSeries)+dataTable(MONTHS,incSeries)+
      (typeCounts.length?'<div style="margin-top:10px">'+typeCounts.map(x=>'<span class="chip n" style="margin:2px">'+esc(x[0])+': <b>'+x[1]+'</b></span>').join(' ')+'</div>':'')+
    '</div>'+
    '<div class="card"><div class="charthead">Safety activities by month — '+yr+'</div>'+
      '<div class="legend">'+actSeries.map(s=>'<span><i style="background:'+s.color+'"></i>'+s.name+'</span>').join('')+'</div>'+
      barChartSVG(MONTHS,actSeries)+dataTable(MONTHS,actSeries)+
      '<div class="hint" style="margin-top:8px">'+tbmN+' TBM conducted in '+yr+'.</div>'+
    '</div>'+
    '<div class="card"><details'+(mh?'':' open')+'><summary>Monthly man-hours — needed for LTIFR</summary>'+
      '<div class="mhgrid">'+mhGrid+'</div>'+
      '<div class="hint" style="margin-top:8px">Total man-hours worked by all personnel each month. LTIFR = (LTI + fatalities) &times; 1,000,000 &divide; man-hours.</div>'+
    '</details></div>';

  document.getElementById('yrSel').onchange=e=>{ statsYear=+e.target.value; renderStats(); };
  app.querySelectorAll('[data-mh]').forEach(inp=>inp.onchange=()=>{
    const v=+inp.value;
    if(v>0) db.manhours[inp.dataset.mh]=v; else delete db.manhours[inp.dataset.mh];
    save(); renderStats();
  });
  bindTips();
}

/* ============ monthly safety data report (HDB Appendix VI) ============ */
let repMonth=today().slice(0,7);

function rankedBars(rows){
  if(!rows.length) return '<div class="hint">No safety non-compliances recorded this month.</div>';
  const max=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>'<div class="hbar"><div class="hlab"><span>'+esc(r.label)+'</span><b>'+r.txt+'</b></div>'+
    '<div class="htrack"><div class="hfill" style="width:'+((r.v/max)*100).toFixed(1)+'%"></div></div></div>').join('');
}

function repData(mk){
  const inMonth=r=>r.date&&r.date.slice(0,7)===mk;
  const inc=db.incidents.filter(inMonth);
  const negs=db.observations.filter(o=>o.kind!==OBS_POS&&inMonth(o));
  const byKey=(arr,fn)=>{ const m={}; arr.forEach(r=>{ const k=(fn(r)||'').trim()||'(unspecified)'; m[k]=(m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  return {
    acc: inc.filter(r=>ACC_TYPES.includes(r.type)).length,
    doN: inc.filter(r=>r.type==='Dangerous Occurrence').length,
    fatal: inc.filter(r=>r.type==='Fatality').length,
    mh: +db.manhours[mk]||0,
    md: +db.mandays[mk]||0,
    negs, pos: db.observations.filter(o=>o.kind===OBS_POS&&inMonth(o)).length,
    trades: byKey(negs,o=>o.trade),
    subs: byKey(negs,o=>o.subcon)
  };
}

function renderReport(){
  const s=db.settings, mk=repMonth;
  const months=new Set([today().slice(0,7)]);
  [].concat(db.incidents,db.observations).forEach(r=>{ if(r.date&&/^\d{4}-\d{2}/.test(r.date)) months.add(r.date.slice(0,7)); });
  Object.keys(db.manhours).forEach(k=>months.add(k)); Object.keys(db.mandays).forEach(k=>months.add(k));
  const mOpts=[...months].sort().reverse().map(k=>'<option value="'+k+'"'+(k===mk?' selected':'')+'>'+
    MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4)+'</option>').join('');
  const d=repData(mk);
  const afrM=d.mh?(d.acc*1e6/d.mh):null;
  const tot=d.negs.length;
  const proj=[['Project',s.project],['HDB building contract no.',s.hdbContract],['Site ref no.',s.siteRef],
    ['Estate / Neighbourhood',[s.estate,s.neighbourhood].filter(Boolean).join(' / ')],['Precinct',s.precinct],['Contractor',s.company]]
    .filter(x=>x[1]).map(x=>x[0]+': <b>'+esc(x[1])+'</b>').join('<br>');
  app.innerHTML = header('Monthly Safety Report', true,
      '<select id="repMonth" class="noprint" style="width:auto;min-height:38px;padding:6px 8px">'+mOpts+'</select>')+
    '<div class="card"><div class="charthead">Monthly Safety Data Report — '+MONTHS[+mk.slice(5,7)-1]+' '+mk.slice(0,4)+'</div>'+
      (proj?'<div class="repmeta" style="margin-bottom:8px">'+proj+'</div>':'')+
      '<div class="repmeta">'+
        'Total workplace accidents reported: <b>'+d.acc+'</b><br>'+
        'Number of dangerous occurrences (DO): <b>'+d.doN+'</b> &nbsp;·&nbsp; Fatalities: <b>'+d.fatal+'</b><br>'+
        'Man-hours worked: <b>'+(d.mh?d.mh.toLocaleString():'—')+'</b> &nbsp;·&nbsp; Accident frequency rate (AFR): <b>'+(afrM===null?'— enter man-hours in Statistics':afrM.toFixed(2)+' / mil man-hours')+'</b>'+
      '</div>'+
      '<label class="noprint">Total mandays worked this month</label>'+
      '<input class="noprint" id="repMd" type="number" min="0" inputmode="numeric" value="'+(d.md||'')+'">'+
      (d.md?'<div class="repmeta">Total mandays worked: <b>'+d.md.toLocaleString()+'</b></div>':'')+
    '</div>'+
    '<div class="card"><div class="charthead">(a) Permit-To-Work status</div>'+
      '<div class="hint">PTW records are managed in the SKYTOPIA ePTW system — attach its monthly PTW status breakdown (Draft / Submitted / Acknowledged / Assessed / Approved / Rejected / Work Completed / Closed) alongside this report.</div>'+
    '</div>'+
    '<div class="card"><div class="charthead">(b) Safety non-compliances by trade (ranked, % of '+tot+')</div>'+
      rankedBars(d.trades.map(t=>({label:t[0], v:t[1], txt:(tot?(t[1]/tot*100).toFixed(0):0)+'% ('+t[1]+')'})))+
    '</div>'+
    '<div class="card"><div class="charthead">(c) Safety non-compliances by subcontractor (ranked)</div>'+
      rankedBars(d.subs.map(t=>({label:t[0], v:t[1], txt:String(t[1])})))+
      (d.pos?'<div class="hint" style="margin-top:8px">'+d.pos+' positive observation(s) also recorded this month.</div>':'')+
    '</div>'+
    '<div class="btnrow noprint">'+
      '<button class="btn" onclick="window.print()">Print / save as PDF</button>'+
      '<button class="btn ghost" onclick="exportReportCsv()">Export CSV (Excel)</button>'+
    '</div>'+
    '<div class="hint noprint" style="margin-top:10px">Underlying observation data is tabulated in the CSV export, as required for HDB statistical analysis. Bulk SFTP data transfer to HDB (Appendix X) is a server-side process outside this app.</div>';
  document.getElementById('repMonth').onchange=e=>{ repMonth=e.target.value; renderReport(); };
  document.getElementById('repMd').onchange=e=>{
    const v=+e.target.value;
    if(v>0) db.mandays[mk]=v; else delete db.mandays[mk];
    save(); renderReport();
  };
}

function exportReportCsv(){
  const mk=repMonth, d=repData(mk);
  const L=[];
  L.push(['Monthly Safety Data Report', MONTHS[+mk.slice(5,7)-1]+' '+mk.slice(0,4)]);
  L.push(['Total workplace accidents reported', d.acc]);
  L.push(['Total mandays worked', d.md||'']);
  L.push(['Man-hours worked', d.mh||'']);
  L.push(['Accident frequency rate (per mil man-hours)', d.mh?(d.acc*1e6/d.mh).toFixed(2):'']);
  L.push(['Number of DO', d.doN]); L.push(['Fatality', d.fatal]); L.push([]);
  L.push(['Breakdown by trade','Count','% of total']);
  d.trades.forEach(t=>L.push([t[0], t[1], d.negs.length?(t[1]/d.negs.length*100).toFixed(1):'0']));
  L.push([]);
  L.push(['Breakdown by subcontractor','Count']);
  d.subs.forEach(t=>L.push([t[0], t[1]])); L.push([]);
  L.push(['S/N','Block','Storey','Unit','Location','Initiator','Subcontractor','Trade','Category','Standard item','Description','Severity','Date found','Time found','Status','Rectified date','Verified date','Closed date','Duration (days)']);
  d.negs.forEach((o,i)=>{
    const dur=(o.closedDate&&o.date)?Math.max(0,Math.round((new Date(o.closedDate)-new Date(o.date))/864e5)):'';
    L.push([i+1,o.block,o.storey,o.unit,o.location,o.initiator,o.subcon,o.trade,o.category,o.subitem,o.desc,o.severity,o.date,o.time,o.status,o.rectifiedDate,o.verifiedDate,o.closedDate,dur]);
  });
  downloadText('safety-report-'+mk+'.csv', L.map(r=>r.map(csvEsc).join(',')).join('\r\n'));
}

/* ============ settings ============ */
function renderSettings(){
  const s=db.settings;
  app.innerHTML = header('Settings', true)+
    '<div class="card"><div class="fgrid">'+
      '<div class="fld"><label>Project name</label><input id="setProject" value="'+esc(s.project||'')+'" placeholder="Shown on the home screen"></div>'+
      '<div class="fld"><label>Company</label><input id="setCompany" value="'+esc(s.company||'')+'"></div>'+
      '<div class="fld half"><label>HDB building contract no.</label><input id="setHdb" value="'+esc(s.hdbContract||'')+'" placeholder="e.g. D/357/18"></div>'+
      '<div class="fld half"><label>HDB site ref no.</label><input id="setRef" value="'+esc(s.siteRef||'')+'"></div>'+
      '<div class="fld half"><label>Estate</label><input id="setEstate" value="'+esc(s.estate||'')+'"></div>'+
      '<div class="fld half"><label>Neighbourhood</label><input id="setNbh" value="'+esc(s.neighbourhood||'')+'"></div>'+
      '<div class="fld"><label>Precinct</label><input id="setPrecinct" value="'+esc(s.precinct||'')+'"></div>'+
    '</div><div class="hint">The HDB fields appear on the monthly safety data report header.</div>'+
    '<div class="btnrow"><button class="btn" id="setSave">Save</button></div></div>'+
    '<div class="card"><label style="margin-top:0">Backup &amp; restore</label>'+
      '<p class="hint">Data lives only in this browser. Export a backup file regularly and keep it somewhere safe; import it to restore or to move to another device.</p>'+
      '<p class="hint">Storage used: ~'+Math.round(JSON.stringify(db).length/1024).toLocaleString()+' KB of a ~5,000 KB browser limit. Photos use the most space.</p>'+
      '<div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="expBtn">Export backup</button>'+
      '<button class="btn ghost" id="impBtn">Import</button></div>'+
      '<input type="file" id="impFile" accept=".json,application/json" hidden>'+
    '</div>'+
    '<div class="card"><label style="margin-top:0">Danger zone</label>'+
      '<div class="btnrow" style="margin-top:10px"><button class="btn danger" id="clrBtn" style="flex:1">Erase all data on this device</button></div>'+
    '</div>';
  document.getElementById('setSave').onclick=()=>{
    s.project=document.getElementById('setProject').value.trim();
    s.company=document.getElementById('setCompany').value.trim();
    s.hdbContract=document.getElementById('setHdb').value.trim();
    s.siteRef=document.getElementById('setRef').value.trim();
    s.estate=document.getElementById('setEstate').value.trim();
    s.neighbourhood=document.getElementById('setNbh').value.trim();
    s.precinct=document.getElementById('setPrecinct').value.trim();
    save(); location.hash='#/';
  };
  document.getElementById('expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='cms-backup-'+today()+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  };
  const impFile=document.getElementById('impFile');
  document.getElementById('impBtn').onclick=()=>impFile.click();
  impFile.onchange=()=>{
    const f=impFile.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||typeof d!=='object'||!Array.isArray(d.members||[])) throw new Error('bad file');
        if(!confirm('Importing replaces ALL data currently on this device. Continue?')) return;
        const out=structuredClone(BLANK);
        for(const k in out){ if(d[k]!==undefined) out[k]=d[k]; }
        db=out; save(); alert('Backup imported.'); location.hash='#/';
      }catch(e){ alert('Could not read that file — is it a CMS backup (.json)?'); }
    };
    rd.readAsText(f);
  };
  document.getElementById('clrBtn').onclick=()=>{
    if(confirm('Erase ALL records on this device?') && confirm('Really erase? Export a backup first if unsure.')){
      db=structuredClone(BLANK); save(); location.hash='#/';
    }
  };
}

route();
</script>
